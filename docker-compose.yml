# ============================================================
# BTOB Multi-Tenant SaaS — Docker Compose (Production)
# ============================================================
# Services: Nginx (reverse proxy + wildcard subdomains),
#           Django HTTP (gunicorn), Django WS (daphne), PostgreSQL, Redis, Celery
# ============================================================

services:
  # --------------- PostgreSQL ---------------
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-btob_db}
      POSTGRES_USER: ${DB_USER:-btob_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-btob_user} -d ${DB_NAME:-btob_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------- Django HTTP (Gunicorn/WSGI) ---------------
  web:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  # --------------- Django WebSocket (Daphne/ASGI) ---------------
  ws:
    build: .
    command: daphne -b 0.0.0.0 -p 8001 Project.asgi:application
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8001"

  # --------------- Nginx (Reverse Proxy) ---------------
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/common_params.inc:/etc/nginx/conf.d/common_params.inc:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
      - ws

  # --------------- Redis (Broker) ---------------
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"

  # --------------- Celery Worker ---------------
  celery_worker:
    build: .
    command: celery -A Project worker -l info
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis

  # --------------- Certbot (SSL) ---------------
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  static_files:
  media_files:
