<div id="wholesale-preview-modal" class="fixed inset-0 z-[10000] hidden items-center justify-center p-4 overflow-y-auto" style="z-index: 10000 !important;">
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="closeWholesalePreview()"></div>
    
    <div class="bg-white w-full max-w-4xl rounded-[32px] shadow-2xl relative z-10 overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300" style="max-height: 90vh;">
        <!-- Header -->
        <div class="px-5 py-3 border-b border-slate-100 flex justify-between items-center bg-white flex-shrink-0">
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <h3 class="text-base font-bold text-slate-900">تفاصيل المنتج بالجملة</h3>
                    <div id="modal-status-badge" class="hidden bg-emerald-600 text-white px-2.5 py-1 rounded-full text-[9px] font-black items-center gap-1 shadow-sm border border-emerald-500/50">
                        <i class="fas fa-check-circle text-[8px]"></i>
                        <span>في متجرك</span>
                    </div>
                </div>
                <p class="text-[10px] text-slate-400" id="modal-category-subtitle">سورس السلعة الآن إلى متجرك</p>
            </div>
            <button onclick="closeWholesalePreview()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-all">
                <i class="fas fa-times text-xs"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-4 overflow-y-auto custom-scrollbar flex-grow">
            <div class="flex flex-col md:flex-row gap-5">
                <!-- Left: Gallery -->
                <div class="w-full md:w-1/2 flex flex-col gap-3">
                    <div class="aspect-square rounded-xl overflow-hidden bg-gray-50 border border-slate-100 flex items-center justify-center p-3">
                        <img id="modal-main-image" src="" class="w-full h-full object-contain">
                    </div>
                    <div id="modal-thumbnail-tray" class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                        <!-- Thumbnails -->
                    </div>
                </div>

                <!-- Right: Product Info -->
                <div class="w-full md:w-1/2 flex flex-col gap-4">
                    <div>
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <span id="modal-category" class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md uppercase tracking-wider"></span>
                            <span id="modal-wholesaler" class="text-[9px] text-slate-400 font-bold"></span>
                        </div>
                        <h2 id="modal-product-name" class="text-lg sm:text-xl font-black text-slate-900 leading-tight"></h2>
                    </div>

                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4">
                        <h4 class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-2">التحميل والربح</h4>
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <p class="text-[8px] text-slate-400 mb-0.5">جملة</p>
                                <p id="modal-purchase-price" class="text-xs font-black text-slate-900"></p>
                            </div>
                            <div>
                                <p class="text-[8px] text-slate-400 mb-0.5">مقترح</p>
                                <p id="modal-sale-price" class="text-xs font-black text-emerald-600"></p>
                            </div>
                            <div class="bg-white rounded-lg p-1.5 text-center border border-slate-100">
                                <p class="text-[7px] text-slate-400 mb-0.5">الربح</p>
                                <p id="modal-profit" class="text-[10px] font-black text-blue-600"></p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-2">وصف المنتج</h4>
                        <p id="modal-description" class="text-[10px] text-slate-600 leading-relaxed text-right"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-5 py-4 bg-white border-t border-slate-100 flex-shrink-0 shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.05)]">
            <button id="modal-inherit-btn" class="w-full py-3 rounded-xl font-black text-base hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg"
                style="background-color: var(--color-action, #ED7D31) !important; color: white !important;">
                <i class="fas fa-plus-circle"></i>
                <span>إضافة إلى متجري الآن</span>
            </button>
        </div>
    </div>
</div>

<style>
    .thumbnail-btn {
        transition: all 0.2s ease;
        border: 2px solid transparent;
    }
    .thumbnail-btn.active {
        border-color: #2563eb;
        transform: scale(1.05);
    }
</style>
