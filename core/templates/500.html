<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ في الخادم (500) | رواج</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #fafafa;
        }
        :root {
            --brand-primary: #10b981;
            --brand-accent: #059669;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50 text-slate-800">
    <div class="max-w-2xl w-full text-center relative z-10">
        <!-- Error Illustration / Number -->
        <div class="relative mb-8 inline-block select-none mt-6">
            <h1 class="text-[110px] md:text-[160px] font-black leading-none text-transparent bg-clip-text bg-gradient-to-b from-gray-200 to-gray-100 drop-shadow-sm">
                500
            </h1>
            
            <!-- Floating Server Icon -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 md:w-28 md:h-28 bg-white rounded-full shadow-xl flex items-center justify-center border-4 border-slate-50">
                <i class="fas fa-server text-4xl md:text-5xl text-rose-500 animate-pulse"></i>
            </div>
            
            <!-- Warning sparkles -->
            <div class="absolute -top-2 -right-6 text-amber-400 text-xl animate-bounce"><i class="fas fa-bolt"></i></div>
            <div class="absolute bottom-6 -left-6 text-rose-400 text-lg animate-bounce"><i class="fas fa-exclamation"></i></div>
        </div>

        <!-- Content -->
        <div class="space-y-3 mb-8">
            <h2 class="text-2xl md:text-3xl font-black text-slate-900">عذراً، حدث خطأ غير متوقع في الخادم!</h2>
            <p class="text-base text-slate-500 max-w-lg mx-auto leading-relaxed font-medium">
                يبدو أن خوادمنا تواجه مشكلة مؤقتة. يجري العمل على معالجتها في أسرع وقت. نعتذر عن هذا الإزعاج.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <button onclick="window.location.reload()" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-slate-700 bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition-all flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-sync-alt text-sm"></i>
                <span>تحديث الصفحة</span>
            </button>
            <a href="/" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg bg-emerald-600 hover:bg-emerald-700">
                <i class="fas fa-home text-sm"></i>
                <span>العودة للرئيسية</span>
            </a>
        </div>
    </div>
</body>
</html>
