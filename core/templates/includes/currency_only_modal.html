<div id="currency-modal" class="fixed inset-0 z-[10000] hidden flex items-center justify-center p-4" style="z-index: 9015 !important;">
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-md transition-opacity" onclick="closeCurrencyModal()"></div>
    
    <div class="bg-white w-full max-w-md rounded-[32px] shadow-2xl relative z-10 overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300" style="max-height: 90vh;">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white flex-shrink-0">
            <div>
                <h3 class="text-lg font-bold text-slate-900">عملة المتجر</h3>
                <p class="text-[11px] text-slate-400 mt-0.5">اختر العملة التي ستظهر بها أسعار منتجاتك</p>
            </div>
            <button onclick="closeCurrencyModal()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-all">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-slate-50/30">
            <form id="currencyForm" onsubmit="submitForm(event, 'currencyForm', 'currency')">
                {% csrf_token %}
                <input type="hidden" name="supplier_id" value="{{ supplier.id }}">
                <input type="hidden" name="form_type" value="currency">
                
                <div class="space-y-6">
                    <div class="flex items-center gap-3 bg-blue-50 text-blue-700 p-4 rounded-2xl text-[12px] font-bold border border-blue-100/50">
                        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-money-bill-wave"></i>
                        </div>
                        <p>تغيير العملة سيقوم بتحديث عرض الأسعار لجميع منتجاتك في المتجر.</p>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-slate-700 mr-1">العملة المختارة</label>
                        {{ currency_form.currency }}
                    </div>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="px-6 py-5 bg-white border-t border-slate-100 flex-shrink-0 shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.05)]">
            <button type="submit" form="currencyForm" 
                class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black text-lg hover:bg-emerald-700 hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100"
                style="background-color: #10b981 !important;">
                <i class="fas fa-check-circle"></i>
                <span>حفظ العملة</span>
            </button>
        </div>
    </div>
</div>

<script>
    function openCurrencyModal() {
        document.getElementById('currency-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeCurrencyModal() {
        document.getElementById('currency-modal').classList.add('hidden');
        document.body.style.overflow = '';
    }
</script>
