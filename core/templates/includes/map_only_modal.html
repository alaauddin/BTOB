<div id="map-modal" class="fixed inset-0 z-[10000] hidden flex items-center justify-center p-4 overflow-y-auto" style="z-index: 10000 !important;">
    <div class="fixed inset-0 bg-slate-900/40 transition-opacity" onclick="closeMapModal()"></div>
    
    <style>
        #standalone-map {
            background-color: #f1f5f9 !important;
            min-height: 400px;
        }
        .leaflet-container {
            z-index: 1 !important;
        }
    </style>
    
    <div class="bg-white w-full max-w-2xl rounded-[32px] shadow-2xl relative z-10 overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300" style="max-height: 90vh;">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white flex-shrink-0">
            <div>
                <h3 class="text-lg font-bold text-slate-900">موقع المتجر</h3>
                <p class="text-[11px] text-slate-400 mt-0.5">حدد موقع متجرك على الخريطة للعملاء</p>
            </div>
            <button onclick="closeMapModal()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-all">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-slate-50/30">
            <form id="locationForm" onsubmit="submitForm(event, 'locationForm', 'location')">
                {% csrf_token %}
                <input type="hidden" name="supplier_id" value="{{ supplier.id }}">
                <input type="hidden" name="form_type" value="location">
                
                <!-- Fields from LocationOnlyForm (prefix='loc') -->
                {{ location_form.latitude }}
                {{ location_form.longitude }}
                
                <div class="space-y-4">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 p-3 rounded-2xl border border-blue-100/50">
                        <i class="fas fa-info-circle"></i>
                        <p class="text-[11px] font-bold">اسحب العلامة الزرقاء أو انقر على الخريطة لتحديد الموقع بدقة.</p>
                    </div>
                    
                    <div class="relative group">
                        <div id="standalone-map" class="w-full h-[400px] rounded-2xl border border-slate-200 shadow-md overflow-hidden relative z-0"></div>
                        <!-- Crosshair Overlay -->
                        <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-10 opacity-20 group-hover:opacity-40 transition-opacity">
                            <i class="fas fa-plus text-slate-400 text-3xl"></i>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="px-6 py-5 bg-white border-t border-slate-100 flex-shrink-0 shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.05)]">
            <button type="submit" form="locationForm" 
                class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-lg hover:bg-blue-700 hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-100"
                style="background-color: #2563eb !important;">
                <i class="fas fa-map-marker-alt"></i>
                <span>حفظ موقع المتجر</span>
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        let standaloneMap;
        let standaloneMarker;

        // Define Custom Geolocation Control for Leaflet
        const MyLocationControl = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function(map) {
                const btn = L.DomUtil.create('button', 'leaflet-bar leaflet-control bg-white flex items-center justify-center gap-2 px-3 shadow-lg hover:bg-slate-50 transition-all border-2 border-slate-200/50 rounded-xl');
                btn.type = 'button';
                btn.title = 'تحديد موقعي الحالي';
                btn.style.height = '40px';
                btn.style.backgroundColor = 'white';
                btn.style.cursor = 'pointer';
                btn.style.border = '2px solid rgba(0,0,0,0.05)';
                btn.innerHTML = `
                    <span class="text-[11px] font-black text-blue-600 whitespace-nowrap">موقعي الحالي</span>
                    <i class="fas fa-location-arrow text-blue-600 text-sm"></i>
                `;
                
                L.DomEvent.disableClickPropagation(btn);
                btn.onclick = function() { useCurrentLocation(standaloneMap, standaloneMarker); };
                return btn;
            }
        });

        window.openMapModal = function() {
            document.getElementById('map-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // Initialize map when modal opens
            setTimeout(() => {
                const latField = document.getElementById('id_loc-latitude');
                const lngField = document.getElementById('id_loc-longitude');
                
                if (!latField || !lngField) {
                    console.error("Coordinate fields not found");
                    return;
                }

                const lat = parseFloat(latField.value) || 15.3694;
                const lng = parseFloat(lngField.value) || 44.1910;
                
                if (!standaloneMap) {
                    standaloneMap = L.map('standalone-map', {
                        zoomControl: false
                    }).setView([lat, lng], 13);
                    
                    L.control.zoom({ position: 'bottomright' }).addTo(standaloneMap);
                    
                    // Add the custom MyLocation control
                    new MyLocationControl({ position: 'bottomright' }).addTo(standaloneMap);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors',
                        maxZoom: 19
                    }).addTo(standaloneMap);
                    
                    standaloneMarker = L.marker([lat, lng], {draggable: true}).addTo(standaloneMap);
                    
                    standaloneMarker.on('dragend', function(e) {
                        const position = standaloneMarker.getLatLng();
                        updateLocationInputs(position.lat, position.lng);
                    });

                    standaloneMap.on('click', function(e) {
                        standaloneMarker.setLatLng(e.latlng);
                        updateLocationInputs(e.latlng.lat, e.latlng.lng);
                    });

                    // Crucial for visibility in modals
                    setTimeout(() => {
                        standaloneMap.invalidateSize();
                    }, 100);
                } else {
                    standaloneMap.invalidateSize();
                    standaloneMap.setView([lat, lng], standaloneMap.getZoom());
                    standaloneMarker.setLatLng([lat, lng]);
                }
            }, 400); 
        };

        window.closeMapModal = function() {
            document.getElementById('map-modal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        function updateLocationInputs(lat, lng) {
            // Update the hidden inputs in the modal form (prefixed)
            document.getElementById('id_loc-latitude').value = lat.toFixed(6);
            document.getElementById('id_loc-longitude').value = lng.toFixed(6);
            
            // Also update the main settings form hidden inputs if they exist (for sync)
            const mainLat = document.getElementById('id_latitude');
            const mainLng = document.getElementById('id_longitude');
            if (mainLat) mainLat.value = lat.toFixed(6);
            if (mainLng) mainLng.value = lng.toFixed(6);
        }

        window.useCurrentLocation = function(map, marker) {
            if (!navigator.geolocation) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ',
                    text: 'متصفحك لا يدعم تحديد الموقع'
                });
                return;
            }

            Swal.fire({
                title: 'جاري تحديد موقعك...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    if (map) {
                        map.setView([lat, lng], 17);
                        if (marker) marker.setLatLng([lat, lng]);
                        updateLocationInputs(lat, lng);
                        
                        // Force redraw
                        setTimeout(() => map.invalidateSize(), 100);
                    }
                    
                    Swal.close();
                    Swal.fire({
                        icon: 'success',
                        title: 'تم التحديد',
                        text: 'تم تحديد موقعك الحالي بنجاح',
                        timer: 1500,
                        showConfirmButton: false,
                        toast: true,
                        position: 'top-end'
                    });
                },
                (error) => {
                    Swal.close();
                    let msg = 'فشل تحديد الموقع';
                    if (error.code === 1) msg = 'يرجى السماح للمتصفح بالوصول لموقعك للمتابعة';
                    Swal.fire({
                        icon: 'info',
                        title: 'تنبيه',
                        text: msg
                    });
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        };
    });
</script>
