<div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6 overflow-hidden">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
        <div>
            <h3 class="text-xl font-black text-gray-900 flex items-center gap-2">
                <i class="fas fa-chart-pie text-blue-500"></i>
                إحصائيات الأداء
            </h3>
            <p class="text-[10px] text-gray-500 font-medium">نظرة عامة على نشاط متجرك ومنتجاتك</p>
        </div>
        
        <!-- Custom Segmented Control (Toggle) -->
        <div class="bg-gray-100 p-1 rounded-2xl flex items-center w-full sm:w-auto h-12">
            <button id="toggle-visitors" onclick="switchChart('visitors')" class="flex-1 sm:px-6 h-full rounded-xl text-xs font-black transition-all bg-white text-blue-600 shadow-sm border border-gray-200/50">
                الزوار (30 يوم)
            </button>
            <button id="toggle-products" onclick="switchChart('products')" class="flex-1 sm:px-6 h-full rounded-xl text-xs font-bold transition-all text-gray-500 hover:text-gray-700">
                مشاهدات المنتجات
            </button>
        </div>
    </div>

    <!-- Visitor Chart Container -->
    <div id="visitors-chart-container" class="relative h-[250px] sm:h-[300px]">
        <canvas id="visitorsChart"></canvas>
    </div>

    <!-- Product Views Chart Container -->
    <div id="products-chart-container" class="relative h-[250px] sm:h-[300px] hidden">
        <canvas id="productsChart"></canvas>
    </div>
</div>
