<div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 relative mb-4">
     <!-- Cover Picture Background (if exists) -->
     {% if supplier.panal_picture %}
     <div class="absolute inset-x-0 top-0 h-24 opacity-20 pointer-events-none overflow-hidden rounded-t-3xl">
        <img src="{{ supplier.panal_picture.url }}" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-white"></div>
     </div>
     {% endif %}

     <div class="relative z-10 flex flex-col sm:flex-row items-center sm:items-start gap-5">
        <!-- Avatar Section -->
        <div class="relative group/logo">
            {% if supplier.profile_picture %}
                <img src="{{ supplier.profile_picture.url }}" alt="{{ supplier.name }}" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-xl">
                <!-- Camera Overlay for existing logo -->
                <button onclick="openBrandingModal()" class="absolute inset-0 bg-black/30 rounded-full flex items-center justify-center opacity-0 group-hover/logo:opacity-100 transition-opacity">
                    <i class="fas fa-camera text-white text-2xl"></i>
                </button>
            {% else %}
                <div class="w-24 h-24 rounded-full bg-slate-200 flex flex-col items-center justify-center shadow-xl border-4 border-white group-hover/logo:scale-105 transition-transform relative">
                    <i class="fas fa-store text-slate-400 text-3xl"></i>
                    <span class="text-[8px] font-black text-slate-500 mt-1">بدون شعار</span>
                    
                    <!-- Absolute Dashboard Prompt (Logo) - Full Background Fix -->
                    <div class="absolute -top-12 z-40 w-max animate-breathe" style="right: 0.1rem; transform: none; left: auto; width: max-content !important;">
                        <span class="onboarding-tooltip text-white text-[12px] px-6 py-2.5 rounded-2xl relative inline-flex items-center justify-center caret-down-orange shadow-2xl whitespace-nowrap">
                            أضف شعار متجرك هنا! ✨
                        </span>
                    </div>

                    <!-- Camera Overlay -->
                    <button onclick="openBrandingModal()" class="absolute inset-0 rounded-full flex items-center justify-center opacity-100 animate-branding-prompt transition-opacity">
                        <i class="fas fa-camera text-white text-2xl"></i>
                    </button>
                </div>
            {% endif %}
            <div class="absolute bottom-1 right-1 w-7 h-7 bg-green-500 rounded-full border-2 border-white flex items-center justify-center shadow-sm">
                <i class="fas fa-check text-white text-xs"></i>
            </div>
        </div>

        <!-- Info Section -->
        <div class="flex-grow text-center sm:text-right">
            <h1 class="text-2xl font-black text-gray-900 mb-2">{{ supplier.name }}</h1>
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-center sm:justify-start gap-2 text-gray-500 font-medium">
                    <div class="w-7 h-7 bg-blue-50 rounded-lg flex items-center justify-center">
                        <i class="fas fa-map-marker-alt text-blue-500 text-sm"></i>
                    </div>
                    <span>{{ supplier.city }}</span>
                </div>
                <div class="flex items-center justify-center sm:justify-start gap-2 text-gray-500 font-medium">
                    <div class="w-7 h-7 bg-green-50 rounded-lg flex items-center justify-center">
                        <i class="fas fa-phone-alt text-green-500 text-sm"></i>
                    </div>
                    <span dir="ltr">{{ supplier.phone }}</span>
                </div>
            </div>
        </div>

        <!-- Settings Button -->
        <button onclick="openSettingsModal()" class="sm:absolute sm:top-0 sm:left-0 bg-gray-50 hover:bg-gray-100 text-gray-600 p-3 rounded-2xl border border-gray-100 transition-all flex items-center gap-2 group">
            <i class="fas fa-cog group-hover:rotate-90 transition-transform duration-500"></i>
            <span class="text-sm font-bold">اعدادات المتجر</span>
        </button>
     </div>
</div>
