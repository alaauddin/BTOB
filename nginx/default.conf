# ============================================================
# Nginx — Wildcard Subdomain Reverse Proxy (HTTP & HTTPS)
# ============================================================
# Handles: *.aratatt.com  →  Django (gunicorn)
# Static/Media files served directly by Nginx for performance.
# ============================================================

upstream django {
    server web:8000;
}

upstream daphne {
    server ws:8001;
}

# --- Redirect HTTP to HTTPS & Handle ACME Challenge ---
server {
    listen 80 default_server;
    server_name aratatt.com *.aratatt.com rawaage.com *.rawaage.com aladd.space *.aladd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server block (aratatt.com) ---
server {
    listen 443 ssl;
    server_name aratatt.com *.aratatt.com;

    # --- SSL Configuration ---
    ssl_certificate     /etc/nginx/ssl/live/aratatt.com-0001/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/aratatt.com-0001/privkey.pem;

    include /etc/nginx/conf.d/common_params.inc;
}

# --- HTTPS Server block (rawaage.com) ---
server {
    listen 443 ssl default_server;
    server_name rawaage.com *.rawaage.com;

    # --- SSL Configuration ---
    ssl_certificate     /etc/nginx/ssl/live/rawaage.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/rawaage.com/privkey.pem;

    include /etc/nginx/conf.d/common_params.inc;
}

# --- HTTPS Server block (Wazen / aladd.space) ---
server {
    listen 443 ssl;
    server_name aladd.space *.aladd.space;

    # --- SSL Configuration ---
    ssl_certificate     /etc/nginx/ssl/live/aladd.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/aladd.space/privkey.pem;

    # --- SSL Optimization (from common_params) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Security Headers (from common_params) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://172.17.0.1:81;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}