# ============================================================
# Nginx — Container Reverse Proxy (BTOB Stack)
# ============================================================
# Upstream handlers for Django (Gunicorn/WSGI) and Daphne (ASGI)
# ============================================================

upstream django {
    server web:8000;
}

upstream daphne {
    server ws:8001;
}

# Preserve upstream protocol (e.g. HTTPS from host Nginx) or fallback to container scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Trust host reverse proxy and internal docker networks to extract real client IP
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Primary Domain: rawaage.com & *.rawaage.com ---
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name rawaage.com *.rawaage.com;

    # SSL Configuration (used when direct SSL or port 8443 is utilized)
    ssl_certificate     /etc/nginx/ssl/live/rawaage.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/rawaage.com/privkey.pem;

    include /etc/nginx/conf.d/common_params.inc;
}

# --- Proxy Server block (peak-hc.store / *.peak-hc.store) ---
server {
    listen 80;
    listen 443 ssl;
    server_name peak-hc.store *.peak-hc.store;

    # SSL Configuration
    ssl_certificate     /etc/nginx/ssl/live/peak-hc.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/peak-hc.store/privkey.pem;

    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://172.17.0.1:81;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}