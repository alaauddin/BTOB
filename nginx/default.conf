# ============================================================
# Nginx — Wildcard Subdomain Reverse Proxy (HTTP & HTTPS)
# ============================================================
# Handles: *.aratatt.com  →  Django (gunicorn)
# Static/Media files served directly by Nginx for performance.
# ============================================================

upstream django {
    server web:8000;
}

upstream daphne {
    server ws:8001;
}

# --- Redirect HTTP to HTTPS & Handle ACME Challenge ---
server {
    listen 80 default_server;
    server_name aratatt.com *.aratatt.com rawaage.com *.rawaage.com aladd.space *.aladd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server block (aratatt.com) ---
server {
    listen 443 ssl;
    server_name aratatt.com *.aratatt.com;

    # --- SSL Configuration ---
    ssl_certificate     /etc/nginx/ssl/live/aratatt.com-0001/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/aratatt.com-0001/privkey.pem;

    include /etc/nginx/conf.d/common_params.inc;
}

# --- HTTPS Server block (rawaage.com) ---
server {
    listen 443 ssl default_server;
    server_name rawaage.com *.rawaage.com;

    # --- SSL Configuration ---
    ssl_certificate     /etc/nginx/ssl/live/rawaage.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/rawaage.com/privkey.pem;

    include /etc/nginx/conf.d/common_params.inc;
}

# --- HTTPS Server block (Wazen / aladd.space) ---
server {
    listen 443 ssl;
    server_name aladd.space *.aladd.space;

    # --- SSL Configuration ---
    # Note: Ensure these certs are available in your ./nginx/ssl/live/ directory
    ssl_certificate     /etc/nginx/ssl/live/aladd.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/aladd.space/privkey.pem;

    include /etc/nginx/conf.d/common_params.inc;

    location / {
        proxy_pass http://172.17.0.1:81;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}